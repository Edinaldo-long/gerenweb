<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Feirinha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Entrar no Sistema</h1>

        <form action="validar_login.php" method="POST" autocomplete="off">
            <div>
                <label for="email_usuario">E-mail:</label>
                <input type="email" id="email_usuario" name="email_usuario" required>
            </div>
            <br>
            <div>
                <label for="senha_usuario">Senha:</label>
                <input type="password" id="senha_usuario" name="senha_usuario" required>
            </div>
            <br>
            <button type="submit">Entrar</button>
        </form>

        <p style="margin-top: 16px;">
            Ainda não tem conta? <a href="cadastro.html">Cadastre-se aqui</a>
        </p>
    </div>

</body>
</html>
