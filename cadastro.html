<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Cadastro de Usuário</h1>

    <form action="cadastrar.php" method="POST" autocomplete="off">

        <div>
            <label for="nome_usuario">Nome Completo:</label>
            <input type="text" id="nome_usuario" name="nome_usuario" required>
        </div>
        <br>
        <div>
            <label for="nome_social">Nome Social:</label>
            <input type="text" id="nome_social" name="nome_social">
        </div>
        <br>
        <div>
            <label for="cpf_usuario">CPF</label>
            <input type="text" id="cpf_usuario" name="cpf_usuario" maxlength="14" required>
        </div>
        <br>
        <div>
            <label for="email_usuario">E-mail:</label>
            <input type="email" id="email_usuario" name="email_usuario" required>
        </div>
        <br>
        
        <br>
        <div>
            <label for="cep_usuario">CEP:</label>
            <input type="text" id="cep_usuario" name="cep_usuario" maxlength="9" placeholder="14400-500" required>
            <span id="status_cep" style="margin-left:8px;"></span>
        </div>
        <br>
        <div>
            <label for="endereco_usuario">Endereço</label>
            <input type="text" id="endereco_usuario" name="endereco_usuario">
        </div>
        <br>
        <div>
            <label for="numero_endereco">Nº</label>
            <input type="text" id="numero_endereco" name="numero_endereco">
        </div>
        <br>
        <div>
            <label for="bairro_usuario">Bairro</label>
            <input type="text" id="bairro_usuario" name="bairro_usuario">
        </div>
        <br>
        <div>
            <label for="cidade_usuario">Cidade</label>
            <input type="text" id="cidade_usuario" name="cidade_usuario">
        </div>
        <br>
        <div>
            <label for="estado_usuario">Estado (UF)</label>
            <input type="text" id="estado_usuario" name="estado_usuario" maxlength="2">
        </div>
        <br>
        <div>
            <label for="complemento_usuario">Complemento</label>
            <input type="text" id="complemento_usuario" name="complemento_usuario">
        </div>
        <div>
            <label for="senha_usuario">Senha:</label>
            <input type="password" id="senha_usuario" name="senha_usuario" required>
        </div>
        <br>
        <button type="submit">Cadastrar</button>

    </form>

    <script>
    const campoCep  = document.getElementById('cep_usuario');
    const statusCep = document.getElementById('status_cep');
    let ultimoCep   = '';

    function mostrar(msg, cor) {
        statusCep.textContent = msg;
        statusCep.style.color = cor || 'black';
    }

    async function buscarCep() {
        const cep = campoCep.value.replace(/\D/g, '');

        if (cep.length === 0) {
            mostrar('');
            return;
        }
        if (cep.length !== 8) {
            mostrar('Digite um CEP com 8 números.', 'red');
            return;
        }
        if (cep === ultimoCep) return;
        ultimoCep = cep;

        mostrar('Buscando CEP...', 'gray');

        const controle = new AbortController();
        const limite   = setTimeout(() => controle.abort(), 8000);

        try {
            const resp  = await fetch('https://viacep.com.br/ws/' + cep + '/json/', { signal: controle.signal });
            const dados = await resp.json();

            if (dados.erro) {
                mostrar('CEP não encontrado.', 'red');
                return;
            }

            document.getElementById('endereco_usuario').value = dados.logradouro || '';
            document.getElementById('bairro_usuario').value   = dados.bairro || '';
            document.getElementById('cidade_usuario').value   = dados.localidade || '';
            document.getElementById('estado_usuario').value   = dados.uf || '';
            mostrar('Endereço preenchido.', 'green');
            document.getElementById('numero_endereco').focus();

        } catch (erro) {
            ultimoCep = '';
            console.error('Erro ao consultar o ViaCEP:', erro);
            mostrar('Não foi possível consultar o ViaCEP (internet ou firewall bloqueando?).', 'red');
        } finally {
            clearTimeout(limite);
        }
    }

    campoCep.addEventListener('input', () => {
        if (campoCep.value.replace(/\D/g, '').length === 8) buscarCep();
    });
    campoCep.addEventListener('blur', buscarCep);
    campoCep.addEventListener('change', buscarCep);
    </script>

</body>
</html>
